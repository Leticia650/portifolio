<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip Expand</title>

<link rel="stylesheet" href="plus_css.css">
    
  
</head>
<body>

  <!-- GRID -->
  <section class="grid">
    <div class="card-container">
      <div class="card" data-title="HTML" data-text="HTML estrutura a página usando tags semânticas, melhorando acessibilidade e SEO.">
        <div class="card-face front"><h3>HTML</h3></div>
        <div class="card-face back"><p>Clique para saber mais</p></div>
      </div>
    </div>

    <div class="card-container">
      <div class="card" data-title="CSS" data-text="CSS é responsável pelo visual da aplicação, layouts responsivos e animações.">
        <div class="card-face front"><h3>CSS</h3></div>
        <div class="card-face back"><p>Clique para saber mais</p></div>
      </div>
    </div>

    <div class="card-container">
      <div class="card" data-title="JavaScript" data-text="JavaScript adiciona interatividade, lógica e dinamismo às páginas web.">
        <div class="card-face front"><h3>JavaScript</h3></div>
        <div class="card-face back"><p>Clique para saber mais</p></div>
      </div>
    </div>

    <div class="card-container">
      <div class="card" data-title="UI Design" data-text="UI Design foca em interfaces intuitivas, consistentes e centradas no usuário.">
        <div class="card-face front"><h3>UI Design</h3></div>
        <div class="card-face back"><p>Clique para saber mais</p></div>
      </div>
    </div>
  </section>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay">
    <div class="expanded-card">
      <button class="close-btn" id="closeBtn">✕</button>
      <h2 id="expandedTitle"></h2>
      <p id="expandedText"></p>
    </div>
  </div>

  <script>
    const cards = document.querySelectorAll(".card");
    const overlay = document.getElementById("overlay");
    const title = document.getElementById("expandedTitle");
    const text = document.getElementById("expandedText");
    const closeBtn = document.getElementById("closeBtn");

    cards.forEach(card => {
      card.addEventListener("click", () => {
        card.classList.add("flipped");
        title.textContent = card.dataset.title;
        text.textContent = card.dataset.text;
        overlay.classList.add("active");
      });
    });

    closeBtn.addEventListener("click", () => {
      overlay.classList.remove("active");
      cards.forEach(card => card.classList.remove("flipped"));
    });
  </script>

</body>
</html>
